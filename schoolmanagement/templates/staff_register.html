<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            min-height:100vh;
            background:linear-gradient(150deg,#4ddda8,#9e0de2);
        }
        .customcard{
            background-color: #e6ece7;

        }
        /* .sp{
            border:0.8px solid black;
        } */
        .card-header{
            background:linear-gradient(150deg,#aa5be7,#4dbedd);
        }
        button{
            background:linear-gradient(150deg,#54dd4d,#9e0de2);
            color:white !important;
        }
        /* .card{
            border-color:#4f46e5;
        } */
        .btn:hover{
            transform:translateY(-3px);
            transition:.3s;
        }
        .alert-custom-error{
            background:#f8d7da;
            border-color:#dc3545;
            color:#721c24;
        }
        .alert-custom-success{
            background:#d4edda;
            border-color:#198754;
            color:#155724;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">
<div class="card shadow-lg border-2 rounded-4 customcard" style="width:30rem;">
    <div class="card-header text-white text-center py-4 rounded-top-4">
        <h3 class="mb-0">Create Account</h3>
    </div>
    <div class="card-body p-4">
        {% with messages=get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category,message in messages %}
            <div class="alert alert-custom-{{'success' if category=='success' else 'error'}} alert-dismissible fade show rounded-3">
                {{message}}
                <button class="btn-close" data-bs-dismiss="alert" style="background:none;transform:none;"> </button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <p class="text-muted text-center mb-4">
            Register yourself to access the School Management System.
        </p>
        <form method="POST">
            <div class="form-floating mb-3 sp">
                <input type="text" class="form-control" id="name" name="name" placeholder="Name" maxlength="25" required>
                <label>Name</label>
            </div>
            <div class="form-floating mb-3 sp">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email" maxlength="50" required>                
                <label>Email Address</label>
            </div>
            <div class="form-floating mb-3 sp">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label>Password</label>
            </div>
            <div class="form-floating mb-4 sp">
                <select class="form-select" id="role" name="role" required>
                    <option value="TEACHER">Teacher</option>
                    <option value="PRINCIPAL">Principal</option>
                </select>
                <label>Role</label>
            </div>
            <div class="d-grid">
                <button class="btn btn-lg rounded-3">
                    Register Now
                </button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
